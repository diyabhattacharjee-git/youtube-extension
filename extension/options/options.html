<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TubeMind settings</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=swap" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1><img src="../icons/icon48.png" alt="" width="36" height="36" /> TubeMind settings</h1>

      <fieldset>
        <legend>Backend</legend>
        <label>Pipeline server URL
          <div class="row">
            <input id="backendUrl" type="url" />
            <button id="test" class="btn" type="button">Test</button>
          </div>
        </label>
        <p id="health" class="hint">The Groq API key is configured on the server in the project's <code>.env</code> file — never in the browser.</p>
        <label class="check"><input id="useLLM" type="checkbox" /> Use LLM (Groq, or the open-source fallback) to write node text</label>
        <label class="check"><input id="allowWhisper" type="checkbox" /> Allow Whisper speech-to-text when a video has no captions</label>
        <label class="check"><input id="serverKeyframes" type="checkbox" /> Extract slides &amp; charts on the server (needs opencv + yt-dlp)</label>
      </fieldset>

      <fieldset>
        <legend>Mindmap defaults</legend>
        <div class="grid">
          <label>Summarization mode
            <select id="mode">
              <option value="revision">Quick revision</option>
              <option value="academic">Academic research</option>
              <option value="deep">Deep exploration</option>
            </select>
          </label>
          <label>Learning profile
            <select id="profile">
              <option value="visual">Visual</option>
              <option value="balanced">Balanced</option>
              <option value="text">Text-heavy</option>
            </select>
          </label>
          <label>Theme
            <select id="theme">
              <option value="sketch">Sketch notes</option>
              <option value="doodle">Yellow doodle</option>
              <option value="chalk">Blackboard (dark)</option>
            </select>
          </label>
          <label>Layout
            <select id="layout">
              <option value="balanced">Balanced (clockwise)</option>
              <option value="radial">Radial</option>
              <option value="right">Logical tree</option>
            </select>
          </label>
        </div>
        <label class="check"><input id="adaptiveProfile" type="checkbox" /> Adapt the learning profile to how I use maps</label>
        <label class="check"><input id="storyboardImages" type="checkbox" /> Add video thumbnails to nodes (YouTube storyboards)</label>
        <label class="check"><input id="followAlong" type="checkbox" /> Follow along: highlight the node for the current playback time</label>
        <label class="check"><input id="switchToVideoOnJump" type="checkbox" /> Switch to the video tab when jumping to a timestamp</label>
      </fieldset>

      <fieldset>
        <legend>You (collaboration)</legend>
        <div class="grid">
          <label>Display name <input id="userName" type="text" maxlength="40" /></label>
          <label>Colour <input id="userColor" type="color" /></label>
          <label>Voice command language
            <select id="voiceLang">
              <option value="en-US">English (US)</option>
              <option value="en-GB">English (UK)</option>
              <option value="en-IN">English (India)</option>
              <option value="hi-IN">Hindi</option>
              <option value="es-ES">Spanish</option>
              <option value="fr-FR">French</option>
              <option value="de-DE">German</option>
            </select>
          </label>
        </div>
      </fieldset>

      <p id="saved" class="saved" hidden>Saved ✓</p>
      <p class="hint">TubeMind is open source (MIT). Your maps are stored locally in your browser; nothing is sent anywhere except your own backend.</p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
